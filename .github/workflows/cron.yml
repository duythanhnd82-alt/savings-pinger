name: Keep Alive & Cron Reminders (Vietnam Time UTC+7)

on:
  schedule:
    # 05:30 và 05:45 sáng giờ Việt Nam (22:30, 22:45 UTC): Đánh thức Server dậy từ 5h30 sáng
    - cron: '30,45 22 * * *'
    # 06:00 sáng đến 23:45 đêm giờ Việt Nam (23:00 UTC và 00:00-16:45 UTC): Giữ thức & quét nhắc việc mỗi 15 phút
    # Từ 00:00 đêm đến 05:30 sáng giờ Việt Nam: Server nghỉ ngơi
    - cron: '*/15 23,0-16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up & Trigger Cron (VN Time)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "https://savings-monitor.onrender.com/health" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          curl -s -S -m 60 "https://savings-monitor.onrender.com/api/cron/todos" || true
