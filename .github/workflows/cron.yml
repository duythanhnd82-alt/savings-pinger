name: Keep Alive & Cron Reminders (Vietnam Time UTC+7)

on:
  schedule:
    # 05:30 - 05:55 sáng giờ VN (22:30 - 22:55 UTC)
    - cron: '30,35,40,45,50,55 22 * * *'
    # 06:00 - 06:55 sáng giờ VN (23:00 - 23:55 UTC)
    - cron: '*/5 23 * * *'
    # 07:00 sáng - 23:55 đêm giờ VN (00:00 - 16:55 UTC): Quét mỗi 5 phút để Render không bao giờ ngủ quá hạn 15 phút
    - cron: '*/5 0-16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up & Trigger Cron (VN Time)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "https://savings-monitor.onrender.com/health" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 5
          done
          curl -s -S -m 60 "https://savings-monitor.onrender.com/api/cron/todos" || true
